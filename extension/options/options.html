<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="settingsTitle">Rich Text settings</title>
  <link rel="stylesheet" href="../theme.css">
  <script src="../theme.js" defer></script>
  <link rel="stylesheet" href="options.css">
  <script src="../shared.js" defer></script>
  <script src="../localize.js" defer></script>
  <script src="options.js" defer></script>
</head>
<body>
  <main>
    <header><img src="../icons/rich-text.svg" width="44" height="44" alt=""><div><h1>Rich Text</h1><p data-i18n="settingsSubtitle">Your compose window, your way.</p></div></header>
    <section aria-labelledby="toolbar-heading">
      <h2 id="toolbar-heading" data-i18n="composeToolbar">Compose toolbar</h2>
      <label class="setting"><input id="show-toolbar" type="checkbox" disabled><span><strong data-i18n="showToolbar">Show the Rich Text toolbar</strong><small data-i18n="showToolbarHelp">Keep formatting tools directly above your message, below Thunderbird’s formatting toolbar.</small></span></label>
      <label class="setting"><input id="hide-native" type="checkbox" disabled><span><strong data-i18n="hideNativeToolbar">Hide Thunderbird’s formatting toolbar</strong><small data-i18n="hideNativeToolbarHelp">Enabled by default. Applies only while the Rich Text toolbar is shown.</small></span></label>
      <p class="note" data-i18n="settingsHelp">Changes apply to all open compose windows and are saved automatically. Hiding Rich Text restores Thunderbird’s own formatting toolbar.</p>
    </section>
    <p id="status" role="status" data-i18n="loadingSettings">Loading settings…</p>
    <p id="error" role="alert" hidden></p>
  </main>
</body>
</html>
